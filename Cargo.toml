[package]
name = "autumn-plugin-discord"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "Autumn plugin: a Discord bot framework — slash commands as Autumn routes, signed interaction webhooks, REST client, and a minimal gateway client."
license = "Apache-2.0"
repository = "https://github.com/madmax983/autumn-plugin-discord"
keywords = ["autumn", "discord", "bot", "slash-commands", "plugin"]
categories = ["web-programming"]
exclude = [".github/", "docs/", "CLAUDE.md", "clippy.toml", "proptest-regressions/"]

[features]
# The gateway client needs a websocket transport with TLS.
# It is on by default; disable it to drop tokio-tungstenite entirely.
default = ["gateway"]
gateway = ["dep:tokio-tungstenite", "dep:futures-util"]

[dependencies]
# No default features: the host app selects the Autumn features.
autumn-web = { version = "0.8", default-features = false }
axum = { version = "0.8", default-features = false }
http = "1"
ed25519-dalek = "2.2"
futures = { version = "0.3", default-features = false, features = ["std"] }
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tokio-tungstenite = { version = "0.29", optional = true, default-features = false, features = ["rustls-tls-webpki-roots"] }
futures-util = { version = "0.3", optional = true, default-features = false, features = ["std", "sink"] }
toml = "1.1"
tracing = "0.1"

[dev-dependencies]
proptest = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "test-util"] }

[package.metadata.docs.rs]
all-features = true

[lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
module_name_repetitions = "allow"
redundant_pub_crate = "allow"
